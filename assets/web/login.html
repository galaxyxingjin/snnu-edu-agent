<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 · 师小助</title>
<style>
  :root {
    --primary: #5b6cff;
    --primary-dark: #3d4fd6;
    --accent: #22d3ee;
    --text: #1f2437;
    --muted: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #eef1ff 0%, #e6fbff 55%, #f4eaff 100%);
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 22px;
    padding: 40px 36px; box-shadow: 0 20px 50px rgba(31,36,55,.14);
  }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand .logo {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .brand h1 { font-size: 22px; font-weight: 800; }
  .brand p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .tabs { display: flex; background: #f1f3ff; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
  .tabs button {
    flex: 1; border: none; background: none; padding: 10px; border-radius: 9px;
    font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s;
  }
  .tabs button.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--text); }
  .field input {
    width: 100%; padding: 12px 15px; border: 1.5px solid #e4e7f5; border-radius: 11px;
    font-size: 15px; outline: none; transition: border .2s, box-shadow .2s;
  }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,108,255,.12); }
  .field input::placeholder { color: #b6bccd; }
  .field input#register-password::placeholder, .field input#register-user::placeholder { color: #b6bccd; }
  .submit {
    width: 100%; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
    transition: background .2s, transform .15s;
  }
  .submit:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .msg { margin-top: 16px; padding: 11px 14px; border-radius: 10px; font-size: 13px; display: none; }
  .msg.ok { display: block; background: #e8fbf1; color: #0c8a4b; }
  .msg.err { display: block; background: #fdecec; color: #d43d3d; }
  .guest { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }
  .guest b { color: #9aa1b5; font-weight: 500; }
  .back { display: block; text-align: center; margin-top: 16px; color: var(--primary); text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">师</div>
      <h1>师小助 · 智能助学 Agent</h1>
      <p>登录后开启专属智能助教</p>
    </div>

    <div class="tabs">
      <button id="tab-login" class="active">登录</button>
      <button id="tab-register">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="login-form">
      <div class="field">
        <label>用户名</label>
        <input id="login-user" type="text" placeholder="游客账号：youke" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="login-pwd" type="password" placeholder="游客密码：123456" autocomplete="current-password">
      </div>
      <button class="submit" type="submit">登录</button>
    </form>

    <!-- 注册表单 -->
    <form id="register-form" style="display:none;">
      <div class="field">
        <label>用户名</label>
        <input id="register-user" type="text" placeholder="2-32 位中英文、数字或下划线" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="register-pwd" type="password" placeholder="6-64 位密码" autocomplete="new-password">
      </div>
      <button class="submit" type="submit">注册</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="guest">游客体验账号 —— 用户名 <b>youke</b> / 密码 <b>123456</b></div>
    <a class="back" href="/">← 返回介绍页</a>
  </div>

<script>
  const tabLogin = document.getElementById('tab-login');
  const tabRegister = document.getElementById('tab-register');
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const msg = document.getElementById('msg');

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    loginForm.style.display = 'block'; registerForm.style.display = 'none';
    msg.className = 'msg';
  });
  tabRegister.addEventListener('click', () => {
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    registerForm.style.display = 'block'; loginForm.style.display = 'none';
    msg.className = 'msg';
  });

  async function post(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pwd').value;
    const data = await post('/api/login', { username, password });
    showMsg(data.message, data.success);
  });

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('register-user').value.trim();
    const password = document.getElementById('register-pwd').value;
    const data = await post('/api/register', { username, password });
    showMsg(data.message, data.success);
  });
</script>
</body>
</html>
