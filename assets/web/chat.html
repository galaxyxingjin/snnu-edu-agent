<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>师小助 · 智能对话</title>
<style>
  :root {
    --primary: #5b6cff;
    --primary-dark: #3d4fd6;
    --accent: #22d3ee;
    --bg: #f6f8ff;
    --text: #1f2437;
    --muted: #6b7280;
    --border: #e5e9f5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(91,108,255,0.06);
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  header .logo {
    width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-size: 18px;
  }
  header .user { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  header .user b { color: var(--primary); }
  header a { text-decoration: none; color: var(--primary); font-size: 13px; }
  header a:hover { text-decoration: underline; }

  #quick {
    display: flex; gap: 10px; padding: 12px 20px; flex-wrap: wrap;
    background: #fff; border-bottom: 1px solid var(--border);
  }
  #quick .chip {
    border: 1px solid var(--border); border-radius: 20px; padding: 7px 14px; cursor: pointer;
    font-size: 13px; color: var(--primary-dark); background: #f4f6ff; transition: all .15s;
  }
  #quick .chip:hover { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: transparent; }

  #chat { flex: 1; overflow-y: auto; padding: 22px 20px; scroll-behavior: smooth; }
  .msg { display: flex; margin-bottom: 18px; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 17px; margin-right: 12px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { margin-right: 0; margin-left: 12px; background: #eef1ff; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
  .msg.ai .avatar { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
  .bubble {
    max-width: 78%; padding: 12px 16px; border-radius: 14px; line-height: 1.7; font-size: 15px;
    background: #fff; border: 1px solid var(--border); word-break: break-word; white-space: normal;
  }
  .msg.user .bubble { border: none; white-space: pre-wrap; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 8px; font-size: 16px; }
  .bubble h3 { font-size: 15px; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { color: var(--primary-dark); }
  .bubble code { background: #f0f2fa; padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, monospace; }
  .bubble pre { background: #1f2437; color: #e6e9f2; padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; color: inherit; padding: 0; }
  .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 14px; }
  .bubble table th, .bubble table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .bubble table th { background: #f4f6ff; }
  .bubble a { color: var(--primary); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

  footer {
    display: flex; gap: 10px; padding: 12px 20px; background: #fff; border-top: 1px solid var(--border);
  }
  footer textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    font-size: 15px; font-family: inherit; outline: none; height: 54px; max-height: 140px; color: var(--text);
  }
  footer textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,108,255,.1); }
  footer button {
    border: none; border-radius: 12px; padding: 0 26px; font-size: 15px; cursor: pointer; font-weight: 600;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; transition: opacity .15s;
  }
  footer button:disabled { opacity: .5; cursor: not-allowed; }
  footer #imgBtn {
    width: 54px; flex-shrink: 0; background: #f4f6ff; color: var(--primary-dark); font-size: 20px;
    border: 1px solid var(--border); padding: 0; display: flex; align-items: center; justify-content: center;
  }
  footer #imgBtn:hover { background: #eef1ff; }
  #preview {
    display: flex; gap: 10px; padding: 10px 20px 0; flex-wrap: wrap; align-items: center;
  }
  #preview .thumb {
    position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border); background: #fff;
  }
  #preview .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #preview .thumb .rm {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer;
  }
  #preview .hint { font-size: 12px; color: var(--muted); }
  .msg.user .bubble img { max-width: 200px; border-radius: 8px; display: block; margin-top: 6px; }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">师</span>师小助 · 智能助学</div>
    <div class="user">你好，<b id="username">同学</b> <a href="/">← 返回介绍页</a></div>
  </header>

  <div id="quick">
    <span class="chip" data-q="我想进入物理具象化实验室，介绍一下有哪些实验">🔬 物理具象化实验室</span>
    <span class="chip" data-q="帮我做一个斜面运动的物理实验模拟，物体质量2kg、斜面倾角30度、动摩擦因数0.1">🧪 斜面运动实验</span>
    <span class="chip" data-q="我想参观原子物理展厅，介绍一下卢瑟福的原子核式结构模型">⚛️ 原子模型参观</span>
    <span class="chip" data-q="帮我出 5 道高等数学选择题（中等难度）">📝 智能出题</span>
  </div>

  <div id="chat"></div>
  <div id="preview" style="display:none"></div>

  <footer>
    <button id="imgBtn" title="上传图片，识别题目">📷</button>
    <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行；可点 📷 上传图片识别题目"></textarea>
    <button id="send">发送</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </footer>

<script>
  // 读取用户名
  const params = new URLSearchParams(location.search);
  const usernameEl = document.getElementById('username');
  const uname = params.get('user') || '同学';
  usernameEl.textContent = uname;

  // 会话 ID（用于跨轮记忆），同浏览器会话内保持一致
  let sessionId = localStorage.getItem('chat_session_id');
  if (!sessionId) {
    sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('chat_session_id', sessionId);
  }

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const imgBtn = document.getElementById('imgBtn');
  const fileInput = document.getElementById('fileInput');
  const previewEl = document.getElementById('preview');
  const pendingImages = [];  // 待发送图片 [{url}]

  // —— 轻量 Markdown 渲染 ——
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderMarkdown(src) {
    if (!src) return '';
    let text = src;
    // 代码块先占位，避免内部符号被误处理
    const codeBlocks = [];
    text = text.replace(/```([\s\S]*?)```/g, (m, c) => { codeBlocks.push(c.replace(/^\n/,'')); return '\u0000CODE' + (codeBlocks.length-1) + '\u0000'; });
    // 表格
    text = text.replace(/((?:^\|.+\|\s*$\n?)+)/gm, function(m) {
      const rows = m.trim().split('\n').map(r => r.trim().replace(/^\||\|$/g, ''));
      if (rows.length === 0) return m;
      const parseRow = r => r.split('|').map(c => c.trim());
      const header = parseRow(rows[0]);
      const body = rows.slice(2).map(parseRow);
      let html = '<table><thead><tr>' + header.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
      body.forEach(r => { html += '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>'; });
      html += '</tbody></table>';
      return html;
    });
    // 转义 HTML
    text = esc(text);
    // 行内代码
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 标题
    text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');
    // 粗体
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // 无序列表
    text = text.replace(/^[-*] (.*)$/gm, '<li>$1</li>');
    // 有序列表
    text = text.replace(/^\d+\. (.*)$/gm, '<li>$1</li>');
    // 把连续的 <li> 包进 ul/ol（简化：统一包 ul）
    text = text.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/gm, '<ul>$1</ul>');
    // 换行 -> <br>
    text = text.replace(/\n{2,}/g, '<br><br>');
    text = text.replace(/\n/g, '<br>');
    // 还原代码块
    text = text.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => '<pre><code>' + codeBlocks[+i] + '</code></pre>');
    return text;
  }

  function addMessage(role, content) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    if (role === 'ai') {
      wrap.innerHTML = '<div class="avatar">师</div><div class="bubble"></div>';
      const bubble = wrap.querySelector('.bubble');
      bubble.innerHTML = content;
    } else {
      wrap.innerHTML = '<div class="avatar">我</div><div class="bubble"></div>';
      wrap.querySelector('.bubble').textContent = content;
    }
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg ai';
    wrap.innerHTML = '<div class="avatar">师</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  // —— 图片预览与上传 ——
  function renderPreview() {
    if (pendingImages.length === 0) {
      previewEl.style.display = 'none';
      previewEl.innerHTML = '';
      return;
    }
    previewEl.style.display = 'flex';
    previewEl.innerHTML = '<span class="hint">已选图片（点 × 移除）：</span>' +
      pendingImages.map((img, i) =>
        '<span class="thumb"><img src="' + img.url + '"><span class="rm" data-i="' + i + '">×</span></span>'
      ).join('');
    previewEl.querySelectorAll('.rm').forEach(el => {
      el.addEventListener('click', () => {
        pendingImages.splice(+el.dataset.i, 1);
        renderPreview();
      });
    });
  }

  async function uploadImage(file) {
    if (!file) return;
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (data && data.success && data.url) {
        pendingImages.push({ url: data.url });
        renderPreview();
      } else {
        alert('图片上传失败：' + ((data && data.message) || '未知错误'));
      }
    } catch (e) {
      alert('图片上传失败：' + (e && e.message || e));
    }
  }

  function addUserMessage(text, imageUrls) {
    const wrap = document.createElement('div');
    wrap.className = 'msg user';
    wrap.innerHTML = '<div class="avatar">我</div><div class="bubble"></div>';
    const bubble = wrap.querySelector('.bubble');
    bubble.textContent = text || '';
    (imageUrls || []).forEach(u => {
      const img = document.createElement('img');
      img.src = u;
      img.alt = '题目图片';
      bubble.appendChild(img);
    });
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  async function send(text) {
    const q = text.trim();
    const hasImg = pendingImages.length > 0;
    if (!q && !hasImg) return;
    inputEl.value = '';
    // 构造消息内容：有图片则为多模态（text + image_url），否则纯文本
    let content = q;
    let imageUrls = [];
    if (hasImg) {
      content = [{ type: 'text', text: q || '请识别图片中的题目并解答' }];
      pendingImages.forEach(img => {
        content.push({ type: 'image_url', image_url: { url: img.url } });
        imageUrls.push(img.url);
      });
    }
    addUserMessage(q, imageUrls);
    // 清空待发送图片
    pendingImages.length = 0;
    renderPreview();
    const typing = addTyping();
    sendBtn.disabled = true;
    try {
      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'snnu-edu-agent',
          messages: [{ role: 'user', content: content }],
          session_id: sessionId,
          stream: false
        })
      });
      const data = await res.json();
      let reply = '';
      if (data && data.choices && data.choices[0] && data.choices[0].message) {
        reply = data.choices[0].message.content || '';
      } else if (data && data.message) {
        reply = data.message;
      } else if (typeof data === 'string') {
        reply = data;
      } else {
        reply = '（抱歉，暂时没有收到有效回复，请稍后再试）';
      }
      typing.querySelector('.bubble').innerHTML = renderMarkdown(reply);
    } catch (e) {
      typing.querySelector('.bubble').innerHTML = '（请求出错：' + esc(String(e && e.message || e)) + '）';
    } finally {
      sendBtn.disabled = false;
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }

  // 欢迎语
  addMessage('ai', renderMarkdown('你好，' + uname + '！我是**师小助**，很高兴为你服务。\n\n我最大的特色是 **🔬 物理具象化实验室**——能把抽象的力学、电学、原子物理变成看得见、算得出的虚拟实验。\n\n你也可以直接问我：学科答疑、智能出题、讲义/PPT/文档生成、联网查资讯……想从哪里开始？'));

  // —— 图片上传交互 ——
  imgBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) {
      uploadImage(fileInput.files[0]);
      fileInput.value = '';
    }
  });
  // 粘贴图片（Ctrl+V）
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.indexOf('image/') === 0) {
        const f = item.getAsFile();
        if (f) { e.preventDefault(); uploadImage(f); }
      }
    }
  });
  // 拖拽图片上传
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files) for (const f of files) if (f.type && f.type.indexOf('image/') === 0) uploadImage(f);
  });

  sendBtn.addEventListener('click', () => send(inputEl.value));
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(inputEl.value); }
  });
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => send(chip.dataset.q));
  });
</script>
</body>
</html>
